name: Atlas DM CI

on:
  push:
    branches:
      - feature/cloudflare-ai-providers
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Atlas DM
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test
